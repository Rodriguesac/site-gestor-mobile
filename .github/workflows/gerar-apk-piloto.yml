name: 🛵 Gerar APK do Entregador

# Isto permite rodar a fábrica manualmente clicando num botão no GitHub
on:
  workflow_dispatch: 

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Baixar o código do projeto
        uses: actions/checkout@v4

      - name: ⚙️ Preparar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ☕ Preparar o Java (Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📦 Instalar dependências (NPM)
        run: npm install

      - name: 🔑 MÁGICA: Isolar apenas o App do Piloto!
        # Isto cria o desvio invisível para o Vite ignorar a loja e gerar só o entregador
        run: echo "VITE_TIPO_APP=entregador" > .env

      - name: 🏗️ Construir o site (React/Vite)
        run: npm run build

      - name: 📱 Passar o código para o Capacitor (Android)
        run: npx cap sync android

      - name: 🔨 Gerar o APK final (Android Studio Core)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 🚀 Disponibilizar o APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: Rodrigues-Pilotos-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk