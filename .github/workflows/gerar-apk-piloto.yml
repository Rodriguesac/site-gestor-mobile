name: Gerar APK do Entregador

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '20'

      - name: Instalar NPM
        run: npm install

      - name: Isolar Entregador
        run: echo "VITE_TIPO_APP=entregador" > .env

      - name: Build Vite
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Gerar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rodrigues-Pilotos-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk